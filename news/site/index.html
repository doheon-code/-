<title>아침 정치경제 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --ground: #eef1f4;
    --paper: #ffffff;
    --ink: #17212c;
    --muted: #5a6776;
    --rule: #d5dbe2;
    --accent: #b8322a;
    --accent-soft: #f6e3e1;
    --key-bg: #17212c;
    --key-ink: #f3f5f8;
    --serif: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #10151b;
      --paper: #171e26;
      --ink: #e6ebf1;
      --muted: #97a3b1;
      --rule: #2b3642;
      --accent: #ec7a6f;
      --accent-soft: #3a2222;
      --key-bg: #222c37;
      --key-ink: #eef2f6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #10151b;
    --paper: #171e26;
    --ink: #e6ebf1;
    --muted: #97a3b1;
    --rule: #2b3642;
    --accent: #ec7a6f;
    --accent-soft: #3a2222;
    --key-bg: #222c37;
    --key-ink: #eef2f6;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.75 var(--sans);
    padding: 0 16px;
  }
  .shell {
    max-width: 1080px;
    margin: 0 auto;
    padding-block: 28px 64px;
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 32px;
    align-items: start;
  }
  header.mast {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
  }
  .mast h1 {
    margin: 0;
    font: 800 clamp(26px, 4vw, 34px)/1.2 var(--serif);
    letter-spacing: -0.01em;
  }
  .mast .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }

  nav.dates { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .dates h2 {
    margin: 0 0 8px;
    font: 600 12px/1 var(--sans);
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .dates ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .dates button {
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 3px solid transparent;
    padding: 6px 10px;
    color: var(--muted);
    font: 500 14px/1.4 var(--mono);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .dates button:hover { color: var(--ink); }
  .dates button[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); background: var(--paper); }
  .dates button:focus-visible, .jump a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dates .dow { font-family: var(--sans); margin-left: 6px; }

  main { min-width: 0; }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 20px; }
  .jump a {
    font-size: 13px;
    padding: 4px 12px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--ink);
    text-decoration: none;
    background: var(--paper);
  }
  .jump a:hover { border-color: var(--accent); }

  article {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: clamp(20px, 4vw, 44px);
  }
  article h1 {
    margin: 0 0 20px;
    font: 800 clamp(22px, 3.2vw, 30px)/1.35 var(--serif);
    text-wrap: balance;
  }
  article h2 {
    margin: 40px 0 12px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font: 700 21px/1.4 var(--serif);
    scroll-margin-top: 16px;
  }
  article blockquote {
    margin: 0;
    padding: 18px 22px;
    background: var(--key-bg);
    color: var(--key-ink);
    font-size: 15.5px;
  }
  article blockquote p { margin: 0; }
  article blockquote p:first-child {
    font: 600 12px/1 var(--sans);
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  article blockquote ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
  article ul { padding-left: 1.1em; display: grid; gap: 12px; max-width: 70ch; }
  article li::marker { color: var(--accent); }
  article strong { font-weight: 600; }
  article a { color: var(--muted); text-underline-offset: 2px; font-size: 0.88em; }
  article a:hover { color: var(--accent); }
  article hr { border: 0; border-top: 1px solid var(--rule); margin: 36px 0 12px; }
  article em { color: var(--muted); font-size: 13px; font-style: normal; }
  .table-wrap { overflow-x: auto; margin: 8px 0 16px; }
  article table { border-collapse: collapse; min-width: 420px; font-size: 14.5px; }
  article th, article td { padding: 8px 14px; border-bottom: 1px solid var(--rule); text-align: left; }
  article th { font-weight: 600; color: var(--muted); font-size: 12px; letter-spacing: 0.06em; }
  article td:nth-child(2) { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .status { color: var(--muted); padding: 40px 0; }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; gap: 16px; padding-block: 16px 48px; }
    nav.dates { position: static; }
    .dates ol { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .dates li { flex: none; }
    .dates button { border-left: 0; border-bottom: 3px solid transparent; padding: 6px 8px; }
    .dates button[aria-current="true"] { border-bottom-color: var(--accent); }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="shell">
  <header class="mast">
    <h1>아침 정치경제 브리핑</h1>
    <span class="meta" id="updated">불러오는 중…</span>
  </header>
  <nav class="dates" aria-label="날짜별 브리핑">
    <h2>지난 브리핑</h2>
    <ol id="dateList"></ol>
  </nav>
  <main>
    <div class="jump" id="jump"></div>
    <article id="view"><p class="status">브리핑을 불러오는 중입니다.</p></article>
  </main>
</div>

<script>
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const view = document.getElementById("view");
  const list = document.getElementById("dateList");
  const jump = document.getElementById("jump");
  let items = [];

  function dow(date) {
    const [y, m, d] = date.split("-").map(Number);
    return DOW[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  }

  function show(date) {
    const item = items.find(b => b.date === date) || items[0];
    if (!item) return;
    view.innerHTML = marked.parse(item.markdown);
    view.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    view.querySelectorAll("table").forEach(t => {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      t.replaceWith(wrap);
      wrap.appendChild(t);
    });
    jump.innerHTML = "";
    view.querySelectorAll("h2").forEach((h, i) => {
      h.id = "s" + i;
      const a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.textContent.replace(/\s*\(.*\)$/, "");
      a.addEventListener("click", e => { e.preventDefault(); h.scrollIntoView(); });
      jump.appendChild(a);
    });
    list.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(b.dataset.date === item.date)));
    try { history.replaceState(null, "", "#d" + item.date.replaceAll("-", "")); } catch (e) {}
  }

  function render(data) {
    items = data.briefings || [];
    document.getElementById("updated").textContent = "갱신 " + data.updated + " · " + items.length + "일치";
    if (!items.length) { view.innerHTML = '<p class="status">아직 올라온 브리핑이 없습니다.</p>'; return; }
    list.innerHTML = "";
    items.forEach(b => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.date = b.date;
      btn.innerHTML = b.date.slice(5).replace("-", ".") + '<span class="dow">' + dow(b.date) + "</span>";
      btn.addEventListener("click", () => { show(b.date); window.scrollTo(0, 0); });
      li.appendChild(btn);
      list.appendChild(li);
    });
    const m = location.hash.match(/^#d(\d{4})(\d{2})(\d{2})$/);
    show(m ? m[1] + "-" + m[2] + "-" + m[3] : items[0].date);
  }

  fetch("briefings.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      document.getElementById("updated").textContent = "";
      view.innerHTML = '<p class="status">브리핑 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>';
    });
</script>
